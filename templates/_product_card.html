<article class="product-card"><a class="product-image product-image-frame" href="{{ url_for('product', product_id=p['id']) }}">{% if p['image'] %}<img src="{{ url_for('uploaded_file', filename=p['image']) }}" alt="{{ p['name'] }}">{% else %}<div class="image-placeholder"><i class="fa-solid fa-cube"></i></div>{% endif %}<span class="product-view"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>{% if p['stock'] <= 0 %}<span class="badge danger">Out of stock</span>{% elif p['stock'] <= 5 %}<span class="badge warning">Low stock</span>{% endif %}</a><div class="product-body"><small><i class="fa-solid fa-tag"></i> {{ p['category'] }}</small><h3><a href="{{ url_for('product', product_id=p['id']) }}">{{ p['name'] }}</a></h3><div class="product-row"><strong>{{ store.currency }}{{ '{:,.0f}'.format(p['price']) }}</strong><a class="mini-btn" href="{{ url_for('product', product_id=p['id']) }}"><i class="fa-solid fa-arrow-right"></i> View</a></div></div></article>
